name: release

on:
  push:
    tags:
      - "*.*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the pinned Chinese Dalamud SDK
        shell: pwsh
        run: .github/scripts/install-dalamud.ps1

      - name: Build the plugin archive
        shell: pwsh
        run: |
          dotnet build MoguangJianying.csproj -c Release -p:Version=${{ github.ref_name }} -p:AssemblyVersion=${{ github.ref_name }} --nologo
          $built = "bin/Release/MoguangJianying/latest.zip"
          if (-not (Test-Path $built)) { throw "Dalamud packager did not produce latest.zip." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $built dist/MoguangJianying.zip
          $hash = (Get-FileHash dist/MoguangJianying.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/SHA256SUMS.txt -Value "MoguangJianying.zip  $hash" -Encoding ascii
          $header = [System.IO.File]::ReadAllBytes("dist/MoguangJianying.zip")
          if ($header[0] -ne 0x50 -or $header[1] -ne 0x4B) { throw "Built archive is not a zip." }

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*

  publish:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist

      - name: Publish the verified archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hashLine = Get-Content dist/SHA256SUMS.txt -Raw
          $notes = @"
          ## ${{ github.ref_name }} 测试版

          进入用途为魔光键影的副本后，读取副本导演上的词条并输入。优先打断正在咏唱的敌人，其次是屏障类词条，其余打最近的敌人。每句之间默认间隔 2000 毫秒。

          安装包只包含插件 DLL 和清单。源码在本仓库。

          ### 校验
          ``````
          $hashLine
          ``````

          ### 支持范围
          - 国服客户端 2026.10.06.0000.0000
          - Dalamud API 15
          - 本包由 Actions 使用 ottercorp/dalamud-distrib 的 15.0.3.8（git ecd08fafd6092c51a011b23fe322442baaecf5ce）编译

          ### 已知问题
          - 请在卫月中打开测试版插件后再安装。
          - 这次还没有实机确认。
          - 默认关闭。安装后用 /mjy on 开始。
          "@
          Set-Content -Path dist/notes.md -Value $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" dist/MoguangJianying.zip dist/SHA256SUMS.txt --repo "${{ github.repository }}" --title "${{ github.ref_name }} testing" --notes-file dist/notes.md

      - name: Confirm the release archive downloads as a zip
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MoguangJianying.zip"
          curl.exe --fail --location --silent --show-error --output confirmed.zip $url
          $header = [System.IO.File]::ReadAllBytes("confirmed.zip")
          if ($header.Length -lt 2 -or $header[0] -ne 0x50 -or $header[1] -ne 0x4B) {
            throw "Release URL did not return a zip: $url"
          }

  subscribe:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Point pluginmaster at the confirmed archive
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MoguangJianying.zip"
          curl.exe --fail --location --silent --show-error --output confirmed.zip $url
          .github/scripts/update-pluginmaster.ps1 -ZipPath confirmed.zip -DownloadUrl $url -OutputPath pluginmaster.json

      - name: Commit the subscription file
        shell: pwsh
        run: |
          git add pluginmaster.json
          if (git diff --cached --quiet) { Write-Output "pluginmaster.json already matches."; exit 0 }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Point the custom repository at verified release ${{ github.ref_name }}."
          git push origin HEAD:main
